id-template-columns:1fr}main{padding:40px 5vw}}</style></head><body><header><a class="brand" href="?view=0">◉ Data Analyzer<small>LOCAL DEMO · NO DATABASE</small></a><nav><a href="?view=0">Overview</a><a href="?view=1">Dataset</a><a href="?view=2">Statistics</a><a href="?view=3">Missing</a></nav></header><main id="app"></main><script>let rows=JSON.parse(localStorage.csvRows||'[{"name":"Alya","score":88},{"name":"Bima","score":74},{"name":"Citra","score":92}]');function render(){let v=+(new URLSearchParams(location.search).get('view')||0),avg=rows.reduce((a,x)=>a+Number(x.score||0),0)/(rows.length||1);app.innerHTML=v===0?'<h1>Turn CSV into insight.</h1><p>Masukkan data percobaan langsung di browser.</p><form onsubmit="return addR(event)"><input id="name" placeholder="Name" required><input id="score" type="number" placeholder="Score" required><button>Add row</button></form>'+table():v===1?'<h1>Dataset</h1>'+table()+'<button onclick="localStorage.removeItem(\'csvRows\');location.reload()">Reset sample</button>':v===2?'<h1>Statistics</h1><div class="grid"><div><small>ROWS</small><b>'+rows.length+'</b></div><div><small>MEAN</small><b>'+avg.toFixed(2)+'</b></div><div><small>MAX</small><b>'+Math.max(...rows.map(x=>+x.score))+'</b></div></div><div class="chart">'+rows.map(x=>'<i style="height:'+x.score+'%"></i>').join('')+'</div>':'<h1>Missing values</h1><p>Rows with missing fields: '+rows.filter(x=>!x.name||x.score==null||x.score==='').length+'</p>'}function table(){return '<section class="list">'+rows.map((x,i)=>'<div>'+x.name+' · '+x.score+' <button onclick="rows.splice('+i+',1);save()">Delete</button></div>').join('')+'</section>'}function addR(e){e.preventDefault();rows.push({name:name.value,score:+score.value});save();return false}function save(){localStorage.csvRows=JSON.stringify(rows);render()}render();</script></body></html>
